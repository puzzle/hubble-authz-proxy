apiVersion: v1
kind: Service
metadata:
  name: {{ include "hubble-authz-proxy.fullname" . }}
  labels:
    {{- include "hubble-authz-proxy.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hubble-authz-proxy.selectorLabels" . | nindent 4 }}
{{- if and .Values.backend.service.create (not .Values.backend.url) }}
---
{{/*
Cilium runs the hubble-ui backend as a sidecar reachable only on
127.0.0.1:8090, so it has no Service. This exposes that container port so the
proxy (running in its own pod) can dial it.

The selector must match the hubble-ui pod, and a Service can only select pods in
its own namespace — so this chart has to be installed alongside hubble-ui, or
backend.url pointed at something you manage yourself.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hubble-authz-proxy.backendServiceName" . }}
  {{- with .Values.backend.service.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "hubble-authz-proxy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- toYaml .Values.backend.service.selector | nindent 4 }}
{{- end }}

{{- if and .Values.hubbleUI.enabled .Values.hubbleUI.oauth2Proxy.enabled (not .Values.hubbleUI.oauth2Proxy.existingSecret) }}
{{- $o := .Values.hubbleUI.oauth2Proxy }}
{{/*
Rendered only when no existingSecret is given. Values supplied this way are
stored in the Helm release too, so an existingSecret managed by your secret
tooling is the better option for anything real.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hubble-authz-proxy.oauth2SecretName" . }}
  labels:
    {{- include "hubble-authz-proxy.uiLabels" . | nindent 4 }}
type: Opaque
stringData:
  client-id: {{ required "hubbleUI.oauth2Proxy.clientID is required (or set existingSecret)" $o.clientID | quote }}
  client-secret: {{ required "hubbleUI.oauth2Proxy.clientSecret is required (or set existingSecret)" $o.clientSecret | quote }}
  {{- /* oauth2-proxy requires exactly 16, 24 or 32 bytes and fails at startup
         otherwise, which is a confusing crashloop to debug. Catch it here. */}}
  {{- $n := len (default "" $o.cookieSecret) }}
  {{- if not (or (eq $n 16) (eq $n 24) (eq $n 32) (eq $n 44)) }}
  {{- fail (printf "hubbleUI.oauth2Proxy.cookieSecret must decode to 16, 24 or 32 bytes; got %d characters. Generate one with: openssl rand -base64 32 | tr -- '+/' '-_'" $n) }}
  {{- end }}
  cookie-secret: {{ $o.cookieSecret | quote }}
{{- end }}

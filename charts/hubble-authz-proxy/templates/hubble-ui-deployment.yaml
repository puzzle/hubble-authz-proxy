{{- if .Values.hubbleUI.enabled }}
{{/*
Everything in one pod, so the proxy sits on the loopback path between the
frontend and the backend rather than beside them:

    frontend :8081 --/api--> 127.0.0.1:<proxy> --> 127.0.0.1:<backend> --> relay

The backend still binds 0.0.0.0, so it remains reachable at podIP:<backend>
from elsewhere in the cluster — that is what networkPolicy.enabled closes, and
owning this pod is what lets the chart ship that policy at all.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hubble-authz-proxy.uiFullname" . }}
  labels:
    {{- include "hubble-authz-proxy.uiLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hubble-authz-proxy.uiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if and .Values.authz.checksumAnnotation (eq .Values.authz.mode "static") (not .Values.authz.existingConfigMap) }}
        checksum/mapping: {{ include (print $.Template.BasePath "/configmap-mapping.yaml") . | sha256sum }}
        {{- end }}
        checksum/nginx: {{ include (print $.Template.BasePath "/hubble-ui-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hubble-authz-proxy.uiSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hubble-authz-proxy.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: "{{ .Values.hubbleUI.frontend.image.repository }}:{{ .Values.hubbleUI.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.hubbleUI.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.hubbleUI.frontend.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.hubbleUI.frontend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            # nginx needs a writable place for temp files under a read-only root.
            - name: tmp-dir
              mountPath: /tmp

        - name: hubble-authz-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --listen={{ .Values.proxy.listen }}
            - --backend=http://127.0.0.1:{{ .Values.hubbleUI.backend.port }}
            - --api-prefix={{ .Values.proxy.apiPrefix }}
            - --authz={{ .Values.authz.mode }}
            - --require-both-endpoints={{ .Values.proxy.requireBothEndpoints }}
            - --channel-ttl={{ .Values.proxy.channelTTL }}
            - --shutdown-timeout={{ .Values.proxy.shutdownTimeout }}
            - --metrics-listen={{ if .Values.metrics.enabled }}:{{ .Values.metrics.port }}{{ end }}
            {{- if eq .Values.authz.mode "static" }}
            - --authz-config=/etc/hubble-authz/mapping.yaml
            {{- else }}
            - --rbac-ttl={{ .Values.authz.cacheTTL }}
            - --rbac-concurrency={{ .Values.authz.concurrency }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- if .Values.metrics.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if eq .Values.authz.mode "static" }}
          volumeMounts:
            - name: mapping
              mountPath: /etc/hubble-authz
              readOnly: true
          {{- end }}

        - name: backend
          image: "{{ .Values.hubbleUI.backend.image.repository }}:{{ .Values.hubbleUI.backend.image.tag }}"
          imagePullPolicy: {{ .Values.hubbleUI.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: EVENTS_SERVER_PORT
              value: {{ .Values.hubbleUI.backend.port | quote }}
            - name: FLOWS_API_ADDR
              value: {{ .Values.hubbleUI.relay.address | quote }}
            {{- if .Values.hubbleUI.relay.tls.enabled }}
            - name: TLS_TO_RELAY_ENABLED
              value: "true"
            - name: TLS_RELAY_SERVER_NAME
              value: {{ .Values.hubbleUI.relay.tls.serverName | quote }}
            - name: TLS_RELAY_CA_CERT_FILES
              value: /var/lib/hubble-ui/certs/hubble-relay-ca.crt
            - name: TLS_RELAY_CLIENT_CERT_FILE
              value: /var/lib/hubble-ui/certs/client.crt
            - name: TLS_RELAY_CLIENT_KEY_FILE
              value: /var/lib/hubble-ui/certs/client.key
            {{- end }}
          ports:
            - name: backend
              containerPort: {{ .Values.hubbleUI.backend.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.hubbleUI.backend.resources | nindent 12 }}
          {{- if .Values.hubbleUI.relay.tls.enabled }}
          volumeMounts:
            - name: relay-certs
              mountPath: /var/lib/hubble-ui/certs
              readOnly: true
          {{- end }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "hubble-authz-proxy.uiFullname" . }}-nginx
        - name: tmp-dir
          emptyDir: {}
        {{- if eq .Values.authz.mode "static" }}
        - name: mapping
          configMap:
            name: {{ include "hubble-authz-proxy.mappingConfigMapName" . }}
        {{- end }}
        {{- if .Values.hubbleUI.relay.tls.enabled }}
        - name: relay-certs
          secret:
            secretName: {{ required "hubbleUI.relay.tls.secretName is required when relay TLS is enabled" .Values.hubbleUI.relay.tls.secretName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

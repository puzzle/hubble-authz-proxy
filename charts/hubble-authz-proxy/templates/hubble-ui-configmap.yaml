{{- if .Values.hubbleUI.enabled }}
{{/*
Owned by this chart rather than Cilium's, which is the point of this mode: the
/api upstream stays pointed at the proxy across upgrades instead of being
silently reset to the backend.

Kept structurally identical to Cilium's config so the frontend behaves the same;
only the /api upstream differs, and it differs only by port because the proxy
takes 8090 and the backend moves aside.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hubble-authz-proxy.uiFullname" . }}-nginx
  labels:
    {{- include "hubble-authz-proxy.uiLabels" . | nindent 4 }}
data:
  nginx.conf: |
    server {
        listen       {{ .Values.hubbleUI.frontend.port }};
        listen       [::]:{{ .Values.hubbleUI.frontend.port }};
        server_name  localhost;
        root /app;
        index index.html;
        client_max_body_size 1G;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            location /api {
                proxy_http_version 1.1;
                # Carries the X-Auth-Request-* headers to the proxy. Without it
                # every request arrives anonymous and is refused.
                proxy_pass_request_headers on;
                proxy_pass http://127.0.0.1:{{ include "hubble-authz-proxy.listenPort" . }};
            }
            location / {
                if ($http_user_agent ~* "kube-probe") { access_log off; }
                # double `/index.html` is required here
                try_files $uri $uri/ /index.html /index.html;
            }

            # Liveness probe
            location /healthz {
                access_log off;
                add_header Content-Type text/plain;
                return 200 'ok';
            }
        }
    }
{{- end }}

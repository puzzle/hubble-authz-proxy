{{- $needsSAR := and .Values.rbac.create (eq .Values.authz.mode "rbac") -}}
{{- $needsUI := and .Values.hubbleUI.enabled .Values.hubbleUI.rbac.create -}}
{{- /* Only granted when the proxy will actually use the watches: turning
       authz.watchRBAC off should not leave the ServiceAccount holding
       cluster-wide read on RBAC it never reads. */}}
{{- $needsRBACWatch := and $needsSAR .Values.authz.watchRBAC -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hubble-authz-proxy.serviceAccountName" . }}
  labels:
    {{- include "hubble-authz-proxy.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if or $needsSAR $needsUI }}
---
{{/*
One ClusterRole for the whole pod. Containers share a ServiceAccount, so in
standalone mode the Hubble UI backend's read access and the proxy's
SubjectAccessReview permission end up on the same identity whether we like it or
not; merging them here at least makes that explicit.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hubble-authz-proxy.fullname" . }}
  labels:
    {{- include "hubble-authz-proxy.labels" . | nindent 4 }}
rules:
  {{- if $needsUI }}
  # Read access the hubble-ui backend needs: it watches namespaces for the
  # picker and reads pods/services to build the service map.
  - apiGroups: [""]
    resources:
      - componentstatuses
      - endpoints
      - namespaces
      - nodes
      - pods
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cilium.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if $needsSAR }}
  {{- if not $needsUI }}
  # The rbac authorizer lists namespaces to know what to ask about{{ if $needsRBACWatch }}, and
  # watches them to invalidate a caller's cached scope when one is deleted{{ end }}.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"{{ if $needsRBACWatch }}, "watch"{{ end }}]
  {{- end }}
  {{- if $needsRBACWatch }}
  # Watched (not just listed) so RBAC changes can invalidate a caller's
  # cached scope sooner than -rbac-ttl. Missing this rule only degrades to
  # TTL-only invalidation — it is never fatal (see RunWatch in
  # authz_rbac_watch.go).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - clusterroles
      - rolebindings
      - clusterrolebindings
    verbs: ["list", "watch"]
  {{- end }}
  # Asking on the caller's behalf, so the proxy never holds their credentials.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hubble-authz-proxy.fullname" . }}
  labels:
    {{- include "hubble-authz-proxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hubble-authz-proxy.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hubble-authz-proxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

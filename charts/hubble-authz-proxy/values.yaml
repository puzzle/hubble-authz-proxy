# -- Keep this at 1 unless you have read the note below.
#
# The proxy is STATEFUL per client. ui.ServiceLink names its endpoints by opaque
# service ID and carries no namespace; the mapping appears only in the
# ServiceState event announcing the service, which may have arrived on an
# earlier poll. The proxy remembers it in the memory of the pod that saw it.
#
# So if a client's polls are spread across replicas, the pod handling this one
# has never seen those announcements. Unknown endpoints are failed closed —
# correctly — and the user's service map loses edges at random, with nothing
# logged and no error anywhere. It reads as "Hubble is flaky", not as a
# misconfiguration.
#
# Going above 1 therefore requires service.sessionAffinity: ClientIP (or
# hubbleUI.service.sessionAffinity in standalone mode); the chart refuses to
# render otherwise. Note that affinity on the Service is not always sufficient:
# an ingress controller that balances straight to pod IPs (Traefik and Cilium's
# ingress can) bypasses it and needs its own stickiness.
replicaCount: 1

image:
  repository: ghcr.io/splattner/hubble-authz-proxy
  pullPolicy: IfNotPresent
  # Defaults to v<appVersion>, matching the published tags.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Deploy Hubble UI ourselves, with the proxy as a sidecar, instead of
# proxying to Cilium's hubble-ui Deployment.
#
# Set hubble.ui.enabled=false in Cilium and enable this. The chart then owns the
# whole pod:
#
#   frontend (nginx :8081) --/api--> 127.0.0.1:<proxy.listen>
#   authz-proxy                ----> 127.0.0.1:<hubbleUI.backend.port>
#   ui-backend                 ----> relay
#
# Why this is the recommended mode: Cilium's chart owns the hubble-ui-nginx
# ConfigMap, so routing its /api through the proxy means editing a resource
# Cilium will overwrite. A `helm upgrade cilium` then silently restores the
# direct path to the backend and every user sees every namespace again, with no
# error and nothing failing. Owning the ConfigMap removes that failure mode, and
# lets this chart ship the NetworkPolicy for the pod rather than asking you to
# add one to a Deployment it does not manage.
hubbleUI:
  enabled: false

  frontend:
    image:
      repository: quay.io/cilium/hubble-ui
      tag: v0.13.5
      pullPolicy: IfNotPresent
    port: 8081
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

  backend:
    image:
      repository: quay.io/cilium/hubble-ui-backend
      tag: v0.13.5
      pullPolicy: IfNotPresent
    # Moved off 8090 so the proxy can take the port the frontend already calls,
    # which keeps the nginx config identical to Cilium's.
    port: 8091
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  relay:
    address: "hubble-relay:80"
    # Cilium sets disable-server-tls in hubble-relay-config when relay serves
    # plaintext. Enable this only if your relay terminates TLS.
    tls:
      enabled: false
      # Secret holding the client cert/key and the CA for relay.
      secretName: ""
      serverName: ""

  service:
    type: ClusterIP
    port: 80
    annotations: {}
    # -- Required when replicaCount > 1; see the note there. "" or ClientIP.
    sessionAffinity: ""
    sessionAffinityConfig: {}

  ingress:
    enabled: false
    className: ""
    # Put your auth middleware / annotations here — this replaces the Ingress
    # Cilium was rendering.
    annotations: {}
    #  traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-oauth2-proxy@kubernetescrd
    hosts:
      - host: hubble.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # -- Run oauth2-proxy as a fourth container instead of authenticating at the
  # ingress. The pod then terminates auth itself:
  #
  #   ingress -> oauth2-proxy :4180 -> frontend :8081 -> proxy -> backend
  #
  # Use this when you do not already run an ingress-level authenticator, or want
  # Hubble UI's auth self-contained rather than depending on middleware
  # annotations that live somewhere else.
  #
  # NOTE: as the reverse proxy, oauth2-proxy emits X-Forwarded-User/-Email/
  # -Groups, not X-Auth-Request-*. The chart sets the proxy's
  # --identity-header-prefix accordingly; do not change one without the other or
  # every request arrives anonymous and is refused.
  oauth2Proxy:
    enabled: false

    image:
      repository: quay.io/oauth2-proxy/oauth2-proxy
      tag: v7.15.3
      pullPolicy: IfNotPresent

    port: 4180

    # Secrets. Prefer existingSecret; inline values end up in your values file
    # and in the release history.
    #
    # existingSecret must provide: client-id, client-secret, cookie-secret
    existingSecret: ""
    clientID: ""
    clientSecret: ""
    # openssl rand -base64 32 | tr -- '+/' '-_'
    cookieSecret: ""

    # -- Flags, as a map of name to value (no leading --). These defaults are
    # the ones a working setup needs; extend rather than replace.
    extraArgs:
      provider: oidc
      # oidc-issuer-url: https://login.example.com/realms/main
      scope: "openid email profile groups"
      # Without this oauth2-proxy rejects every login: the default allows no
      # email domain at all.
      email-domain: "*"
      # Trust the ingress's X-Forwarded-* when building redirect URLs.
      reverse-proxy: "true"
      # Emit the identity to the upstream, which is the frontend in this pod.
      pass-user-headers: "true"
      # Do not hand the upstream the raw token; the proxy only needs identity.
      pass-authorization-header: "false"
      set-authorization-header: "false"
      skip-provider-button: "true"

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

  # The backend watches namespaces and reads pods/services through the API
  # server. Containers share the pod's ServiceAccount, so when authz.mode=rbac
  # these rules are merged with the SubjectAccessReview permissions.
  rbac:
    create: true

# -- Where the unmodified hubble-ui backend can be reached.
#
# In Cilium's default install the backend is a sidecar in the hubble-ui pod
# listening on 127.0.0.1:8090, so it has no Service of its own. Enable
# backendService below to create one that selects that pod, or point `url` at a
# Service you manage yourself.
backend:
  url: ""
  service:
    create: true
    name: ""
    # Selector for the pod running the hubble-ui backend container.
    selector:
      k8s-app: hubble-ui
    port: 8090
    targetPort: 8090
    # Namespace the hubble-ui pod runs in. A Service can only select pods in its
    # own namespace, so this must match where you install the chart.
    namespace: ""

proxy:
  # -- Address the proxy listens on.
  listen: ":8090"
  # -- Path prefix carrying backend routes; anything else is passed through
  # unfiltered and without requiring an identity (health checks, assets).
  apiPrefix: "/api"
  # -- When true, a flow or service-map edge is shown only if BOTH endpoints are
  # in an allowed namespace. When false (default), either endpoint suffices,
  # which lets a user see what their namespace talks to but reveals the peer's
  # namespace name.
  requireBothEndpoints: false
  # -- How long per-channel service-map state is kept after a client goes idle.
  channelTTL: 10m
  # -- Cap on client channels holding service-map state.
  #
  # A reload, a navigation or a namespace switch each start a fresh channel and
  # abandon the old one, so on channelTTL alone a busy UI accumulates one
  # cluster-sized service map per abandoned session for the whole idle period.
  # Past this cap the least recently used channel is dropped.
  #
  # Roughly one channel per active browser tab, so the default is generous.
  # Watch hubble_authz_channel_evictions_total: sustained nonzero means live
  # sessions are being dropped and briefly losing service-map links. 0 disables
  # the cap and restores unbounded growth.
  maxChannels: 1024
  # -- Largest backend response the proxy will buffer in order to filter it.
  #
  # The whole body is held in memory while it is decoded, filtered and
  # re-encoded, so peak usage is roughly this times the number of callers
  # polling at once — keep it well under resources.limits.memory. Service-map
  # responses are the large ones and grow with cluster size; a few hundred KB is
  # typical. Oversized responses are refused with 502, never forwarded
  # unfiltered, and are counted as outcome="response_too_large".
  maxResponseBytes: 8388608  # 8 MiB

  # -- Tell a caller with no visible namespaces why the UI is empty.
  #
  # Without it they get a blank namespace picker and no explanation, which is
  # indistinguishable from Hubble being broken and is the most common support
  # report this proxy produces. With it, hubble-ui shows a warning in its Status
  # Center naming the identity the proxy saw — which is exactly what an admin
  # needs in order to map them.
  #
  # It relies on hubble-ui rendering ui.NoPermission, which is internal to
  # hubble-ui. Turn it off if a future release stops doing so; nothing else
  # changes.
  notifyEmptyScope: true

  # -- debug | info | warn | error
  #
  # debug logs the identity and resolved scope of every request, which is the
  # fastest way to answer "why does this user see nothing" — it distinguishes
  # headers not arriving from a mapping that does not match. It names users, so
  # treat the logs accordingly.
  logLevel: info
  # -- text | json
  logFormat: text

  # -- How long in-flight requests get to finish after SIGTERM. The UI holds
  # long-poll requests open, so cutting them short surfaces as browser errors
  # during every rollout. Keep below terminationGracePeriodSeconds.
  shutdownTimeout: 20s

# -- Metrics and health, served on their own port.
#
# Deliberately not on the proxy port: reaching that port is what authenticates a
# caller, so anything exposed there widens the trust boundary and would need
# Prometheus allowed through the NetworkPolicy.
metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    # Requires the prometheus-operator CRDs.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    relabelings: []
    metricRelabelings: []

authz:
  # -- static | rbac
  #
  # static: map OIDC groups/users to namespaces with the mapping below.
  # rbac:   ask the API server, per namespace, whether the caller may list pods
  #         there. Tracks real kubectl access; costs one SubjectAccessReview per
  #         namespace on a cache miss.
  mode: static

  # Used when mode=rbac.
  #
  # Cost is (active users x namespaces) SubjectAccessReviews per cacheTTL, so on
  # a cluster with many namespaces raise this — 5m cuts the load fivefold at the
  # price of taking up to 5m to notice revoked access. Callers who may list pods
  # cluster-wide cost one review regardless.
  cacheTTL: 60s
  # Reviews issued in parallel per resolution. Latency is roughly
  # namespaces/concurrency round trips.
  concurrency: 16

  # -- Watch RBAC for changes and drop a caller's cached scope early (mode=rbac).
  #
  # Without this, revoking access takes up to cacheTTL to apply, which is the
  # direction that matters and the reason not to raise cacheTTL freely. With it,
  # a change to a Role, ClusterRole, RoleBinding or ClusterRoleBinding naming the
  # caller evicts their entry, so the next request re-resolves against current
  # RBAC. cacheTTL still backstops whatever a watch misses, so this shrinks the
  # average staleness window rather than capping the worst case.
  #
  # Costs list/watch on those four resources plus watch on namespaces, granted
  # below when rbac.create is set. Turning this off drops both the watches and
  # those permissions, leaving cacheTTL as the only thing that expires an entry.
  watchRBAC: true

  # -- How often the proxy re-reads the mapping file (mode=static).
  #
  # kubelet updates a mounted ConfigMap in place, so without this an edit
  # appears to work — the ConfigMap changes, the file inside the pod changes —
  # and does nothing until the pod restarts. Revocations are delayed the same
  # way, which is the direction that matters.
  #
  # A failed read or an unparseable file KEEPS THE PREVIOUS MAPPING, so a
  # half-written file cannot lock everyone out. That failure is loud rather than
  # silent: alert on hubble_authz_mapping_last_reload_timestamp_seconds going
  # stale, which also catches a reloader that stopped.
  #
  # Set to 0 to disable and go back to requiring a restart. Note kubelet's own
  # sync period (~1 min by default) sets the real floor on how fast an edit can
  # possibly arrive; polling faster than that does not help.
  reloadInterval: 30s

  # Used when mode=static. Rendered into a ConfigMap and mounted at
  # /etc/hubble-authz/mapping.yaml.
  mapping:
    admins: []
    #  - platform-admins
    #  - alice@example.com
    groupToNamespaces: {}
    #  team-payments:
    #    - payments
    #    - payments-staging
    userToNamespaces: {}
    #  bob@example.com:
    #    - sandbox-bob

  # -- Mount an existing ConfigMap instead of rendering `mapping` above. The key
  # must be "mapping.yaml".
  existingConfigMap: ""

  # -- Roll the Deployment when the mapping ConfigMap changes.
  #
  # Only applied when reloadInterval is 0. With hot-reload on, restarting every
  # pod on a mapping edit is pure disruption — it kills the long-poll requests
  # the UI holds open, which shows up as errors in the browser.
  checksumAnnotation: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # -- Create the ClusterRole/Binding the rbac authorizer needs
  # (create subjectaccessreviews, list namespaces). Ignored when
  # authz.mode is static.
  create: true

service:
  type: ClusterIP
  port: 8090
  annotations: {}
  # -- Required when replicaCount > 1; see the note there. "" or ClientIP.
  sessionAffinity: ""
  sessionAffinityConfig: {}
  #  clientIP:
  #    timeoutSeconds: 10800

# -- Restrict who may reach the proxy.
#
# This is load-bearing, not optional hardening: the proxy TRUSTS the
# X-Auth-Request-* headers on every request. Anything that can reach it directly
# can claim to be any user. Only the pod terminating authentication should be
# allowed in.
networkPolicy:
  enabled: false
  # Pods allowed to reach the proxy (typically oauth2-proxy, or the hubble-ui
  # frontend if oauth2-proxy runs as its sidecar).
  ingressFrom: []
  #  - podSelector:
  #      matchLabels:
  #        k8s-app: hubble-ui

  # -- Pods allowed to reach the metrics port. Needs its own entry: ingressFrom
  # above admits only the authenticating pod, and only on the proxy port, so
  # leaving this empty means Prometheus cannot scrape.
  metricsIngressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: monitoring

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # Must be numeric. The image declares its user by name, and kubelet cannot
  # verify a name against runAsNonRoot — it fails with
  # CreateContainerConfigError. 65532 is the uid of distroless's nonroot user.
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

extraArgs: []
extraEnv: []
